# Age public key for encrypting credential files (same recipient as deployment.infra).
# Bootstrap encrypts with this public key only — no private key needed on Cloud Shell.
creation_rules:
  - path_regex: credentials/gcp/.*/auth\.yaml$
    encrypted_regex: "^(.*)$"
    age: age1s570flcma83aa5lxzfvgz0y6gh5r3pnfmhlhlxamyux24dsquq7s6zffpt
