# Edge contract for Cloud Run — see docs/SSL_EDGE_POLICY.md
#
# Region: europe-west1 (Cloud Run domain mapping supported).
#
# SSL split:
#   Cloudflare Universal SSL (orange) + Worker:
#     api.stawi.org only (path APIs + Scalar)
#   Preferred: Cloud Run domain mapping + DNS records Google prints:
#     accounts, oauth2, oauth2-w, authz, authz-w
#   Interim: CF orange CNAME → *.run.app + Origin Host rewrite / Worker fallback
#   Break-glass: Google Global LB (edge-lb-identity hosts non-empty)
#
# Product APIs: only api.stawi.org/<path>.
# Zone SSL mode: Full (strict).

version: 1
prod:
  zone: stawi.org
  issuer: https://stawi.org
  region: europe-west1
  ssl:
    zone_mode: full_strict
    policy_doc: docs/SSL_EDGE_POLICY.md

  cloudflare_worker:
    app: edge/cloudflare-api-gateway
    routes_config: edge/cloudflare-api-gateway/config/routes.prod.json
    hostnames:
      - api.stawi.org
    paths:
      /profile: { service: identity-profile, project: stawi-identity }
      /tenancy: { service: identity-tenancy, project: stawi-identity }
      /identity: { service: identity-identity, project: stawi-identity }
      /devices: { service: platform-devices, project: stawi-platform }
      /settings: { service: platform-settings, project: stawi-platform }
      /geolocation: { service: platform-geolocation, project: stawi-platform }
      /files: { service: platform-files, project: stawi-platform }
      /audit: { service: operations-audit, project: stawi-operations }
      /formstore: { service: operations-formstore, project: stawi-operations }
      /queuestore: { service: operations-queuestore, project: stawi-operations }
      /redirect: { service: operations-redirect, project: stawi-operations }
      /thesa: { service: operations-thesa, project: stawi-operations }
      /trustage: { service: operations-trustage, project: stawi-operations }

  # Preferred long-term: Cloud Run domain mappings (see scripts/create-domain-mappings.sh)
  domain_mappings:
    - hostname: accounts.stawi.org
      service: identity-authentication
      project: stawi-identity
    - hostname: oauth2.stawi.org
      service: identity-oauth2-hydra
      project: stawi-identity
    - hostname: oauth2-w.stawi.org
      service: identity-oauth2-hydra-admin
      project: stawi-identity
    - hostname: authz.stawi.org
      service: identity-authorization-keto-read
      project: stawi-identity
    - hostname: authz-w.stawi.org
      service: identity-authorization-keto-write
      project: stawi-identity

  # Interim orange CNAME → Cloud Run (managed by edge/cloudflare-api-gateway ensure-cf-dns)
  cloudflare_direct_cnames:
    - accounts.stawi.org  # identity-authentication
    - oauth2.stawi.org    # identity-oauth2-hydra
    - oauth2-w.stawi.org
    - authz.stawi.org
    - authz-w.stawi.org

  front_doors:
    edge-lb-identity:
      gcp_project: stawi-identity
      cloudflare_proxied: false
      # Empty = no Google LB. Re-add hosts only as break-glass.
      hosts: {}
    edge-lb-platform:
      gcp_project: stawi-platform
      hosts: {}
    edge-lb-operations:
      gcp_project: stawi-operations
      hosts: {}

  authenticated:
    - identity-authorization-keto-read
    - identity-authorization-keto-write
    - identity-oauth2-hydra-admin
