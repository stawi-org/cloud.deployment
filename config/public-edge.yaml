# Public edge contract for Cloud Run (host-per-service).
#
# europe-west9 does NOT support classic Cloud Run domain mappings.
# Hostnames are served via Global HTTPS LBs (apps/edge-lb-identity, edge-lb-platform)
# with Certificate Manager + serverless NEGs.
#
# Optional: Cloudflare can still map api.stawi.org/<path> → these hosts.

version: 1
prod:
  zone: stawi.org
  issuer: https://stawi.org
  region: europe-west9
  front_doors:
    edge-lb-identity:
      gcp_project: stawi-identity
      hosts:
        accounts.stawi.org: identity-authentication
        oauth2.stawi.org: identity-oauth2-hydra
        profile.stawi.org: identity-profile
        tenancy.stawi.org: identity-tenancy
        identity.stawi.org: identity-identity
    edge-lb-platform:
      gcp_project: stawi-platform
      hosts:
        devices.stawi.org: platform-devices
        settings.stawi.org: platform-settings
        geolocation.stawi.org: platform-geolocation
        files.stawi.org: platform-files
  private:
    - identity-authorization-keto-read
    - identity-authorization-keto-write
  cloudflare_path_aliases:
    api.stawi.org:
      /profile: profile.stawi.org
      /tenancy: tenancy.stawi.org
      /identity: identity.stawi.org
      /devices: devices.stawi.org
      /settings: settings.stawi.org
      /geolocation: geolocation.stawi.org
      /files: files.stawi.org
