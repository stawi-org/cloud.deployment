# Neon multi-account registry (NON-SECRET metadata only).
# Canonical model: docs/GITHUB_SECRETS.md + docs/BACKEND.md
#
# app.yaml neon.account → this key.
# Org API key lives in credentials/neon/<account>/auth.yaml (SOPS).
# CI decrypts with repository secret SOPS_AGE_KEY — no GitHub Environments.
# Never put API keys in this file.

version: 1
accounts:
  identity:
    description: Identity domain Neon organization
    owners: [identity-team]
    neon_org_hint: Stawi Identity
    neon_org_id: org-rapid-mountain-41505493
    allowed_deploy_envs: [stawi-dev, stawi-prod]
    # Prevent platform/other domain apps from accidentally landing DBs here.
    allowed_app_prefixes: [identity-]
    sensitivity: critical
    sops_auth_path: credentials/neon/identity/auth.yaml
  notifications:
    description: Notifications domain Neon organization
    owners: [communications-team]
    neon_org_hint: Stawi Notifications
    allowed_deploy_envs: [stawi-dev, stawi-prod]
    allowed_app_prefixes: []
    sensitivity: high
  payments:
    description: Payments domain Neon organization
    owners: [finance-team]
    neon_org_hint: Stawi Payments
    allowed_deploy_envs: [stawi-dev, stawi-prod]
    allowed_app_prefixes: [payment-, checkout-, billing-, ledger-]
    sensitivity: critical
  platform:
    description: Shared platform Neon organization (devices, settings, geolocation, files)
    owners: [platform]
    neon_org_hint: Stawi Platform
    neon_org_id: org-calm-cell-68997035
    allowed_deploy_envs: [stawi-dev, stawi-prod]
    allowed_app_prefixes: [platform-]
    sensitivity: medium
    sops_auth_path: credentials/neon/platform/auth.yaml
  labs:
    description: Experimental Neon organization; no production customer data
    owners: [platform]
    neon_org_hint: Stawi Labs
    allowed_deploy_envs: [stawi-dev]
    allowed_app_prefixes: []
    sensitivity: low
  operations:
    description: Neon organization for operations domain (auto-registered by bootstrap-neon-account.sh)
    owners:
      - platform
    allowed_deploy_envs:
      - stawi-dev
      - stawi-prod
    allowed_app_prefixes:
      - operations-
    sensitivity: medium
    sops_auth_path: credentials/neon/operations/auth.yaml
    neon_org_hint: Stawi Operations
