# Neon multi-account registry (NON-SECRET metadata only).
# Canonical model: docs/superpowers/specs/2026-07-24-account-selection-and-ci-credentials.md
#
# app.yaml neon.account → this key.
# GitHub Environment name MUST be: neon--{account}
# Secret inside that environment MUST be: API_KEY
# Neon API key is only loaded in CI when the app selects this neon.account.
# Never put API keys in this file.

version: 1

accounts:
  identity:
    description: Identity domain Neon organization
    owners: [identity-team]
    github_environment: neon--identity
    neon_org_hint: Stawi Identity
    allowed_deploy_envs: [stawi-dev, stawi-prod]
    allowed_app_prefixes: []
    sensitivity: critical
    sops_auth_path: credentials/neon/identity/auth.yaml

  notifications:
    description: Notifications domain Neon organization
    owners: [communications-team]
    github_environment: neon--notifications
    neon_org_hint: Stawi Notifications
    allowed_deploy_envs: [stawi-dev, stawi-prod]
    allowed_app_prefixes: []
    sensitivity: high

  payments:
    description: Payments domain Neon organization
    owners: [finance-team]
    github_environment: neon--payments
    neon_org_hint: Stawi Payments
    allowed_deploy_envs: [stawi-dev, stawi-prod]
    allowed_app_prefixes: [payment-, checkout-, billing-, ledger-]
    sensitivity: critical

  platform:
    description: Shared platform edge Neon organization
    owners: [platform]
    github_environment: neon--platform
    neon_org_hint: Stawi Platform Edge
    allowed_deploy_envs: [stawi-dev, stawi-prod]
    allowed_app_prefixes: []
    sensitivity: medium

  labs:
    description: Experimental Neon organization; no production customer data
    owners: [platform]
    github_environment: neon--labs
    neon_org_hint: Stawi Labs
    allowed_deploy_envs: [stawi-dev]
    allowed_app_prefixes: []
    sensitivity: low

  stawi-org:
    description: "LEGACY alias — prefer domain keys"
    owners: [platform]
    github_environment: neon--platform
    neon_org_hint: Stawi Platform Edge (legacy)
    allowed_deploy_envs: [stawi-dev, stawi-prod]
    allowed_app_prefixes: []
    sensitivity: medium
    deprecated: true
    deprecated_message: Use a domain account key (identity, notifications, payments, platform, labs)

  stawi-labs:
    description: "LEGACY alias for labs"
    owners: [platform]
    github_environment: neon--labs
    neon_org_hint: Stawi Labs (legacy)
    allowed_deploy_envs: [stawi-dev]
    allowed_app_prefixes: []
    sensitivity: low
    deprecated: true
    deprecated_message: Use neon.account labs
