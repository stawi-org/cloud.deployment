# Required GCP Secret Manager secrets for opportunities domain (stawi-opportunities).
# Two Neon projects: product (matching) + crawl (crawler).

project_hint: stawi-opportunities
gcp_account: opportunities
env: stawi-prod

shared:
  - id: hydra-webhook-psk
    required: true
    source_hints:
      - "seeded OOB copy of identity hydra-webhook-psk"
      - "frame module default oauth_signer_secret"

apps:
  opportunities-matching:
    runtime_secrets:
      - id: opportunities-matching-database-url
        managed_by_tofu: true
        notes: "product Neon (pooled)"
      - id: opportunities-matching-database-url-direct
        managed_by_tofu: true
        notes: "product Neon (direct; migrate)"
      - id: hydra-webhook-psk
        shared: true
      - id: billing-webhook-secret
        env: BILLING_WEBHOOK_SECRET
        required: true
        source_hints:
          - "k8s: product-opportunities/billing-credentials-opportunities"
      - id: checkout-internal-token
        env: CHECKOUT_INTERNAL_TOKEN
        required: true
        source_hints:
          - "must match checkout CHECKOUT_INTERNAL_TOKEN"
      - id: opportunities-embedding-api-key
        env: EMBEDDING_API_KEY
        required: true
        notes: "NVIDIA Build nvapi key for candidate persona embeddings (same model as cluster worker opportunity vectors)"
        source_hints:
          - "platform-chat-agent-inference-secondary-api-keys on stawi-platform (copy)"
          - "vault: stawi/product-opportunities/common/inference-credentials nvidia_api_key"
          - "k8s: product-opportunities/inference-credentials-opportunities EMBEDDING_API_KEY"

  opportunities-api:
    runtime_secrets:
      - id: opportunities-matching-database-url
        shared: true
        notes: "API attaches to matching product Neon; no second product project"
      - id: hydra-webhook-psk
        shared: true

  opportunities-crawler:
    runtime_secrets:
      - id: opportunities-crawler-database-url
        managed_by_tofu: true
        notes: "crawl Neon (pooled); seed to k8s crawl-neon-credentials-opportunities"
      - id: opportunities-crawler-database-url-direct
        managed_by_tofu: true
        notes: "crawl Neon (direct; migrate Job)"
