# Required GCP Secret Manager secrets for platform domain (stawi-prod → stawi-platform).
# Values are NEVER in git. Populate with:
#   scripts/sync-cluster-secrets-to-gcp.sh
#   scripts/seed-gcp-secrets.sh
#
# Vault paths (KV v2 mount `secret`): stawi/platform/...

project_hint: stawi-platform
gcp_account: platform
env: stawi-prod

shared:
  - id: hydra-webhook-psk
    description: OAuth private_key_jwt signer PSK (same value as identity)
    required: true
    used_by: [platform-devices, platform-settings, platform-geolocation, platform-files, platform-chat-agent]
    source_hints:
      - "k8s: platform/hydra-webhook-psk psk (or identity/hydra-webhook-psk)"
      - "scripts/sync-cluster-secrets-to-gcp.sh"

apps:
  platform-chat-agent:
    runtime_secrets:
      - id: platform-chat-agent-database-url
        managed_by_tofu: true
        env: DATABASE_URL
      - id: platform-chat-agent-database-url-direct
        managed_by_tofu: true
        notes: "Neon direct (migrate/setup Job)"
      - id: hydra-webhook-psk
        shared: true
      - id: platform-chat-agent-inference-api-keys
        env: INFERENCE_API_KEYS
        required: true
        notes: "Comma-separated Google AI / Gemini keys (priority order; sticky failover)"
        source_hints:
          - "Google AI Studio API keys"
          - "./scripts/seed-gcp-secrets.sh --project stawi-platform --set platform-chat-agent-inference-api-keys=..."
      - id: platform-chat-agent-inference-secondary-api-keys
        env: INFERENCE_SECONDARY_API_KEYS
        required: false
        notes: "Optional OpenAI key pool; map in secret_env_extra when seeded"
        source_hints:
          - "OpenAI API keys"
          - "./scripts/seed-gcp-secrets.sh --project stawi-platform --set platform-chat-agent-inference-secondary-api-keys=..."

  platform-files:
    runtime_secrets:
      - id: platform-files-database-url
        managed_by_tofu: true
        env: DATABASE_URL
      - id: platform-files-encryption-phrase
        env: ENCRYPTION_PHRASE
        required: true
        source_hints:
          - "k8s: platform/service-files-encryption ENCRYPTION_PHRASE"
          - "ESO generator (not vault) when healthy"
      - id: platform-files-s3-endpoint
        env: S3_ENDPOINT
        required: true
        source_hints:
          - "vault: stawi/platform/files/r2-credentials r2_endpoint_url"
          - "k8s: platform/cloudflare-r2-storage-creds ENDPOINT_URL"
      - id: platform-files-s3-access-key-id
        env: S3_ACCESS_KEY_ID
        required: true
        source_hints:
          - "vault: stawi/platform/files/r2-credentials r2_access_key_id"
          - "k8s: platform/cloudflare-r2-storage-creds ACCESS_KEY_ID"
      - id: platform-files-s3-access-key-secret
        env: S3_ACCESS_KEY_SECRET
        required: true
        source_hints:
          - "vault: stawi/platform/files/r2-credentials r2_secret_access_key"
          - "k8s: platform/cloudflare-r2-storage-creds ACCESS_SECRET_KEY"
      - id: hydra-webhook-psk
        env: OAUTH2_SIGNER_API_KEY
        shared: true

  platform-devices:
    runtime_secrets:
      - id: platform-devices-database-url
        managed_by_tofu: true
        env: DATABASE_URL
      - id: platform-devices-cloudflare-turn-token-id
        env: CLOUDFLARE_TURN_TOKEN_ID
        required: true
        source_hints:
          - "vault: stawi/platform/devices/cloudflare-turn cf_turn_id"
          - "k8s: platform/service-devices-cloudflare-turn-secret cf_turn_id"
      - id: platform-devices-cloudflare-turn-api-token
        env: CLOUDFLARE_TURN_API_TOKEN
        required: true
        source_hints:
          - "vault: stawi/platform/devices/cloudflare-turn cf_turn_api_key"
          - "k8s: platform/service-devices-cloudflare-turn-secret cf_turn_api_key"
      - id: hydra-webhook-psk
        shared: true

  platform-settings:
    runtime_secrets:
      - id: platform-settings-database-url
        managed_by_tofu: true
        env: DATABASE_URL
      - id: hydra-webhook-psk
        shared: true

  platform-geolocation:
    runtime_secrets:
      - id: platform-geolocation-database-url
        managed_by_tofu: true
        env: DATABASE_URL
      - id: hydra-webhook-psk
        shared: true

cluster_only_not_synced:
  - ghcr-auth
  - nats operator/user creds
  - db-credentials-*
  - cloudflare-r2 token key (only access keys + endpoint used on Cloud Run)
