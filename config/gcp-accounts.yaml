version: 1
accounts:
  identity:
    description: Identity domain GCP (auth, hydra, keto, profile, tenancy, identity)
    owners:
      - identity-team
    sensitivity: critical
    envs:
      stawi-dev:
        project_id: stawi-identity-dev
        region: europe-west1
        workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/cloud-deployment
        deploy_service_account: tofu-deploy@stawi-identity-dev.iam.gserviceaccount.com
        sops_auth_path: credentials/gcp/identity/stawi-dev/auth.yaml
        labels:
          environment: dev
          domain: identity
          managed-by: cloud-deployment
      stawi-prod:
        project_id: stawi-identity
        region: europe-west1
        # OpenTofu apply (this repo only)
        workload_identity_provider: projects/721554040672/locations/global/workloadIdentityPools/github/providers/github-actions
        deploy_service_account: tofu-deploy@stawi-identity.iam.gserviceaccount.com
        # Decentralized image ship (service repos — see docs/CLOUDRUN_SHIP.md)
        ship_workload_identity_provider: projects/721554040672/locations/global/workloadIdentityPools/github/providers/github-ship
        ship_service_account: cloudrun-ship@stawi-identity.iam.gserviceaccount.com
        sops_auth_path: credentials/gcp/identity/stawi-prod/auth.yaml
        labels:
          environment: prod
          domain: identity
          managed-by: cloud-deployment
  notifications:
    description: Notifications domain GCP
    owners:
      - communications-team
    sensitivity: high
    envs:
      stawi-dev:
        project_id: stawi-notifications-dev
        region: europe-west1
        workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/cloud-deployment
        deploy_service_account: tofu-deploy@stawi-notifications-dev.iam.gserviceaccount.com
        labels:
          environment: dev
          domain: notifications
          managed-by: cloud-deployment
      stawi-prod:
        project_id: stawi-notifications-prod
        region: europe-west1
        workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/cloud-deployment
        deploy_service_account: tofu-deploy@stawi-notifications-prod.iam.gserviceaccount.com
        labels:
          environment: prod
          domain: notifications
          managed-by: cloud-deployment
  payments:
    description: Payments domain GCP
    owners:
      - finance-team
    sensitivity: critical
    envs:
      stawi-dev:
        project_id: stawi-payments-dev
        region: europe-west1
        workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/cloud-deployment
        deploy_service_account: tofu-deploy@stawi-payments-dev.iam.gserviceaccount.com
        labels:
          environment: dev
          domain: payments
          managed-by: cloud-deployment
      stawi-prod:
        project_id: stawi-payments
        region: europe-west1
        workload_identity_provider: projects/131149412918/locations/global/workloadIdentityPools/github/providers/github-actions
        deploy_service_account: tofu-deploy@stawi-payments.iam.gserviceaccount.com
        labels:
          environment: prod
          domain: payments
          managed-by: cloud-deployment
        sops_auth_path: credentials/gcp/payments/stawi-prod/auth.yaml
  platform:
    description: Shared platform edge GCP
    owners:
      - platform
    sensitivity: medium
    envs:
      stawi-dev:
        project_id: stawi-platform-dev
        region: europe-west1
        workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/cloud-deployment
        deploy_service_account: tofu-deploy@stawi-platform-dev.iam.gserviceaccount.com
        labels:
          environment: dev
          domain: platform
          managed-by: cloud-deployment
      stawi-prod:
        project_id: stawi-platform
        region: europe-west1
        workload_identity_provider: projects/305282281906/locations/global/workloadIdentityPools/github/providers/github-actions
        deploy_service_account: tofu-deploy@stawi-platform.iam.gserviceaccount.com
        ship_workload_identity_provider: projects/305282281906/locations/global/workloadIdentityPools/github/providers/github-ship
        ship_service_account: cloudrun-ship@stawi-platform.iam.gserviceaccount.com
        labels:
