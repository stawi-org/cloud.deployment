# One-shot: dump Cloud Run revision logs for operations apps (WIF).
name: debug-ops-logs

on:
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service name
        required: true
        default: operations-audit
      project:
        description: GCP project
        required: true
        default: stawi-operations
      region:
        description: Region
        required: true
        default: europe-west9

jobs:
  logs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install sops + yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo wget -qO /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          sudo chmod +x /usr/local/bin/sops
      - name: Decrypt WIF + auth
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          sops -d credentials/gcp/operations/stawi-prod/auth.yaml > /tmp/ops-auth.yaml
          echo "WIF_PROVIDER=$(yq -r '.auth.workload_identity_provider' /tmp/ops-auth.yaml)" >> "$GITHUB_ENV"
          echo "DEPLOY_SA=$(yq -r '.auth.deploy_service_account' /tmp/ops-auth.yaml)" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Ensure logging.viewer on deploy SA
        run: |
          set -euo pipefail
          gcloud projects add-iam-policy-binding "${{ inputs.project }}" \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role="roles/logging.viewer" \
            --condition=None --quiet || true
          gcloud projects add-iam-policy-binding "${{ inputs.project }}" \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role="roles/logging.viewAccessor" \
            --condition=None --quiet || true

      - name: Dump service + recent logs
        run: |
          set -euo pipefail
          SVC="${{ inputs.service }}"
          PROJ="${{ inputs.project }}"
          REG="${{ inputs.region }}"
          echo "=== status conditions ==="
          gcloud run services describe "$SVC" --project="$PROJ" --region="$REG" \
            --format='yaml(status.conditions,status.traffic,status.url)' || true
          echo "=== container image + ports + env names ==="
          gcloud run services describe "$SVC" --project="$PROJ" --region="$REG" \
            --format='yaml(spec.template.spec.containers)' || true
          echo "=== latest revision status ==="
          REV=$(gcloud run revisions list --service="$SVC" --project="$PROJ" --region="$REG" --format='value(name)' --limit=1)
          echo "revision=$REV"
          gcloud run revisions describe "$REV" --project="$PROJ" --region="$REG" \
            --format='yaml(status.conditions,status.logUrl,spec.containers)' || true
          echo "=== try run services logs read ==="
          gcloud run services logs read "$SVC" --project="$PROJ" --region="$REG" --limit=100 2>&1 || true
          echo "=== logging read ==="
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SVC\"" \
            --project="$PROJ" --limit=100 --freshness=6h \
            --format='table(timestamp,severity,textPayload)' 2>&1 || true

          echo "=== Neon extensions via DATABASE_URL secret (if present) ==="
          SECRET_ID="${SVC}-database-url-direct"
          if gcloud secrets describe "$SECRET_ID" --project="$PROJ" >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client >/dev/null
            URL=$(gcloud secrets versions access latest --secret="$SECRET_ID" --project="$PROJ")
            echo "probing $(echo "$URL" | sed -E 's#://([^:]+):[^@]+@#://\1:***@#')"
            psql "$URL" -v ON_ERROR_STOP=1 -c "SELECT extname, extversion FROM pg_extension ORDER BY 1;" 2>&1 || true
            psql "$URL" -v ON_ERROR_STOP=1 -c \
              "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE; CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\" CASCADE;" 2>&1 || true
            psql "$URL" -v ON_ERROR_STOP=1 -c "SELECT extname, extversion FROM pg_extension ORDER BY 1;" 2>&1 || true
          else
            echo "secret $SECRET_ID not found"
          fi