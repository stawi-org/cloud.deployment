# Deploy Cloudflare Worker path gateway for api.stawi.org
#
# Secrets:
#   CLOUDFLARE_API_TOKEN — Workers Scripts:Edit + Workers Routes:Edit + DNS:Read on stawi.org
# Optional:
#   CLOUDFLARE_ACCOUNT_ID — if wrangler cannot resolve the account from the token
name: edge-api-gateway

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run smoke tests against api.stawi.org after deploy
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "edge/cloudflare-api-gateway/**"
      - ".github/workflows/edge-api-gateway.yml"

concurrency:
  group: edge-api-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edge/cloudflare-api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge/cloudflare-api-gateway/package-lock.json

      - name: Install
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi

      - name: Validate + test
        run: |
          npm run validate
          npm test

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c358ea38bde6fd03d13bf87068635230' }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required (Workers Scripts:Edit + Zone Workers Routes:Edit)"
            exit 1
          fi
          # Fail fast with a clear message if the token is DNS-only
          code=$(curl -sS -o /tmp/cf-workers.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" || true)
          if [[ "$code" != "200" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN cannot list Workers (HTTP ${code}). Update the secret with Account Workers Scripts:Edit + Zone Workers Routes:Edit on stawi.org. See edge/cloudflare-api-gateway/scripts/ensure-token-scopes.md"
            head -c 500 /tmp/cf-workers.json || true
            echo
            exit 1
          fi
          npx wrangler deploy
          # Drop stale Worker routes for direct_cnames (wrangler won't remove them)
          node scripts/ensure-cf-delete-worker-routes.mjs
          # api → Worker dummy A; all direct_cnames → orange CNAME → *.run.app
          # (CF Universal SSL; no Google managed cert). Includes pay.stawi.org.
          node scripts/ensure-cf-dns.mjs
          # Optional overlay: grey CNAME → ghs.googlehosted.com for IAM hosts only.
          # Does NOT include pay — hosted checkout stays on CF direct mapping.
          # Set USE_DOMAIN_MAPPING_DNS=false to leave every direct_cname on CF path.
          if [[ "${USE_DOMAIN_MAPPING_DNS:-true}" == "true" ]]; then
            node scripts/ensure-cf-domain-mapping-dns.mjs
          fi
          # Always apply Origin Host rewrite for CF-proxied direct_cnames (pay, and
          # any host not greyed by domain-mapping DNS). Without this, Cloud Run
          # sees Host: pay.stawi.org and returns Google 404 / CF 521.
          set +e
          node scripts/ensure-cf-origin-rules.mjs
          OR_RC=$?
          set -e
          if [[ "$OR_RC" -eq 2 ]]; then
            echo "::warning::Origin Host rules not applied. Enabling Worker host fallback for CF-direct hosts only."
            node scripts/ensure-cf-worker-host-fallback.mjs
          elif [[ "$OR_RC" -ne 0 ]]; then
            exit "$OR_RC"
          fi




      - name: Smoke api.stawi.org + public hosts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          sleep 12
          GATEWAY_BASE=https://api.stawi.org npm run smoke
          echo "---- accounts / oauth2 / pay (CF direct or domain-map overlay) ----"
          for u in \
            https://accounts.stawi.org/readyz \
            https://oauth2.stawi.org/health/ready; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 25 "$u" || echo ERR)
            echo "$code $u"
            [[ "$code" == "200" ]] || { head -c 200 /tmp/body; echo; exit 1; }
          done
          # pay: CF direct path — any non-edge-failure proves Host rewrite works
          pay_code=$(curl -sS -o /tmp/paybody -w "%{http_code}" --max-time 25 "https://pay.stawi.org/" || echo ERR)
          echo "$pay_code https://pay.stawi.org/"
          if [[ ! "$pay_code" =~ ^[1234][0-9][0-9]$ ]]; then
            head -c 200 /tmp/paybody; echo
            echo "::error::pay.stawi.org edge down (expected CF direct → checkout-checkout)"
            exit 1
          fi
