# Deploy Cloudflare Worker path gateway for api.stawi.org
#
# Secrets:
#   CLOUDFLARE_API_TOKEN — Workers Scripts:Edit + Workers Routes:Edit + DNS:Read on stawi.org
# Optional:
#   CLOUDFLARE_ACCOUNT_ID — if wrangler cannot resolve the account from the token
name: edge-api-gateway

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run smoke tests against api.stawi.org after deploy
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "edge/cloudflare-api-gateway/**"
      - ".github/workflows/edge-api-gateway.yml"

concurrency:
  group: edge-api-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edge/cloudflare-api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge/cloudflare-api-gateway/package-lock.json

      - name: Install
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi

      - name: Validate + test
        run: |
          npm run validate
          npm test

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c358ea38bde6fd03d13bf87068635230' }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required (Workers Scripts:Edit + Zone Workers Routes:Edit)"
            exit 1
          fi
          # Fail fast with a clear message if the token is DNS-only
          code=$(curl -sS -o /tmp/cf-workers.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" || true)
          if [[ "$code" != "200" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN cannot list Workers (HTTP ${code}). Update the secret with Account Workers Scripts:Edit + Zone Workers Routes:Edit on stawi.org. See edge/cloudflare-api-gateway/scripts/ensure-token-scopes.md"
            head -c 500 /tmp/cf-workers.json || true
            echo
            exit 1
          fi
          npx wrangler deploy
          # Drop stale Worker routes for accounts/oauth2 (wrangler won't remove them)
          node scripts/ensure-cf-delete-worker-routes.mjs
          # api.stawi.org → Worker dummy A only (ensure-cf-dns still manages api host)
          node scripts/ensure-cf-dns.mjs
          # Preferred: Cloud Run domain mappings (europe-west1) → grey CNAME ghs.googlehosted.com
          # Overwrites direct_cnames run.app CNAMEs / Worker fallback for those hosts.
          node scripts/ensure-cf-domain-mapping-dns.mjs


      - name: Smoke api.stawi.org + public hosts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          sleep 12
          GATEWAY_BASE=https://api.stawi.org npm run smoke
          echo "---- accounts / oauth2 ----"
          for u in \
            https://accounts.stawi.org/readyz \
            https://oauth2.stawi.org/health/ready; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 25 "$u" || echo ERR)
            echo "$code $u"
            [[ "$code" == "200" ]] || { head -c 200 /tmp/body; echo; exit 1; }
          done
