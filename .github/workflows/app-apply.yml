# Main / manual: apply only for changed or module-impacted apps.
name: app-apply

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "modules/**"
      - "platforms/**"
      - "config/**"
      - ".github/scripts/**"
      - ".github/workflows/app-*.yml"
  workflow_dispatch:
    inputs:
      app:
        required: false
        type: string
        default: ""
        description: Optional app name (applies only this app)
      env:
        required: false
        type: string
        default: ""
        description: Optional env (default first envs[] entry in app.yaml)

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      nonempty: ${{ steps.d.outputs.nonempty }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - id: d
        name: Detect changed apps + Neon environments
        env:
          INPUT_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.app || '' }}
          INPUT_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || '' }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_APP}" ]]; then
            ENV="${INPUT_ENV}"
            if [[ -z "$ENV" ]]; then
              ENV=$(yq -r '.envs[0]' "apps/${INPUT_APP}/app.yaml")
            fi
            MATRIX=$(jq -nc --arg a "${INPUT_APP}" --arg e "$ENV" '[{app:$a,env:$e}]')
          else
            git fetch origin main 2>/dev/null || true
            if [[ "${{ github.event_name }}" == "push" && -n "${EVENT_BEFORE}" && "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              BASE_REF="${EVENT_BEFORE}"
              HEAD_REF="${{ github.sha }}"
            else
              BASE_REF="origin/main"
              HEAD_REF="HEAD"
            fi
            MATRIX=$(BASE_REF="$BASE_REF" HEAD_REF="$HEAD_REF" .github/scripts/detect-changed-apps.sh)
          fi
          ENRICHED=$(echo "$MATRIX" | .github/scripts/enrich-matrix-neon.sh .)
          echo "matrix=${ENRICHED}" >> "$GITHUB_OUTPUT"
          if [[ "$ENRICHED" == "[]" ]]; then
            echo "nonempty=false" >> "$GITHUB_OUTPUT"
          else
            echo "nonempty=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected: ${ENRICHED}"

  apply:
    needs: detect
    if: needs.detect.outputs.nonempty == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/app-tofu.yml
    with:
      app: ${{ matrix.app }}
      env: ${{ matrix.env }}
      mode: apply
      neon_github_environment: ${{ matrix.neon_github_environment }}
    secrets: inherit
