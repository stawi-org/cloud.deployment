# Verify all operations Cloud Run services are Ready (WIF).
name: ops-verify

on:
  workflow_dispatch:
    inputs:
      project:
        description: GCP project for operations
        required: true
        type: string
        default: stawi-operations
      region:
        description: Cloud Run region
        required: true
        type: string
        default: europe-west1

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install sops + yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo wget -qO /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          sudo chmod +x /usr/local/bin/sops

      - name: Decrypt WIF
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          sops -d credentials/gcp/operations/stawi-prod/auth.yaml > /tmp/ops-auth.yaml
          echo "WIF_PROVIDER=$(yq -r '.auth.workload_identity_provider' /tmp/ops-auth.yaml)" >> "$GITHUB_ENV"
          echo "DEPLOY_SA=$(yq -r '.auth.deploy_service_account' /tmp/ops-auth.yaml)" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Grant operator IAM
        run: |
          set -euo pipefail
          PROJ="${{ inputs.project }}"
          for member in user:bwire@stawi.org user:bwire517@gmail.com; do
            for role in roles/viewer roles/logging.viewer roles/run.viewer; do
              gcloud projects add-iam-policy-binding "$PROJ" \
                --member="$member" --role="$role" --condition=None --quiet || true
            done
          done

      - name: Verify services
        env:
          PROJ: ${{ inputs.project }}
          REG: ${{ inputs.region }}
        run: |
          set -euo pipefail
          FAIL=0
          for SVC in operations-audit operations-formstore operations-queuestore operations-redirect operations-thesa operations-trustage; do
            echo "======== $SVC ========"
            READY=$(gcloud run services describe "$SVC" --project="$PROJ" --region="$REG" \
              --format='value(status.conditions[0].status)' 2>/dev/null || echo MISSING)
            URL=$(gcloud run services describe "$SVC" --project="$PROJ" --region="$REG" \
              --format='value(status.url)' 2>/dev/null || echo "")
            echo "ready=$READY url=$URL"
            gcloud run services describe "$SVC" --project="$PROJ" --region="$REG" --format=json \
              | python3 -c "import json,sys; d=json.load(sys.stdin); envs=d['spec']['template']['spec']['containers'][0].get('env') or []; secs=sorted(e['name'] for e in envs if 'valueFrom' in e); print('secret_envs:', ','.join(secs)); print('literal_count:', sum(1 for e in envs if 'value' in e))"
            if [ -n "$URL" ]; then
              TOKEN=$(gcloud auth print-identity-token --audiences="$URL" 2>/dev/null || true)
              for path in /readyz /healthz /health; do
                if [ -n "$TOKEN" ]; then
                  CODE=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 -H "Authorization: Bearer $TOKEN" "${URL}${path}" || echo 000)
                else
                  CODE=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "${URL}${path}" || echo 000)
                fi
                echo "probe ${path} -> HTTP $CODE"
                case "$CODE" in
                  2*) break ;;
                esac
              done
            fi
            if [ "$READY" != "True" ]; then
              echo "::error::$SVC not Ready"
              FAIL=1
            else
              echo "OK $SVC"
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "All operations services Ready on $PROJ"
