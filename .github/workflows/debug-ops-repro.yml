# Reproduce a failing operations Cloud Run container locally in CI with SM secrets.
name: debug-ops-repro

on:
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service name
        required: true
        default: operations-audit
      project:
        required: true
        default: stawi-operations
      region:
        required: true
        default: europe-west1

jobs:
  repro:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo wget -qO /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          sudo chmod +x /usr/local/bin/sops
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane
      - name: Decrypt WIF
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          sops -d credentials/gcp/operations/stawi-prod/auth.yaml > /tmp/ops-auth.yaml
          echo "WIF_PROVIDER=$(yq -r '.auth.workload_identity_provider' /tmp/ops-auth.yaml)" >> "$GITHUB_ENV"
          echo "DEPLOY_SA=$(yq -r '.auth.deploy_service_account' /tmp/ops-auth.yaml)" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pull image + run with production env/secrets
        env:
          SVC: ${{ inputs.service }}
          PROJ: ${{ inputs.project }}
          REG: ${{ inputs.region }}
        run: |
          set -euo pipefail
          IMG=$(gcloud run services describe "$SVC" --project="$PROJ" --region="$REG" \
            --format='value(spec.template.spec.containers[0].image)')
          echo "image=$IMG"
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          crane pull --platform linux/amd64 "$IMG" /tmp/svc.tar
          docker load -i /tmp/svc.tar | tee /tmp/load.out
          LOCAL_TAG=$(sed -n 's/^Loaded image: //p' /tmp/load.out | tail -1)
          echo "local_tag=$LOCAL_TAG"
          gcloud run services describe "$SVC" --project="$PROJ" --region="$REG" --format=json > /tmp/svc.json
          python3 <<'PY'
          import json, subprocess, os
          svc = json.load(open("/tmp/svc.json"))
          envs = svc["spec"]["template"]["spec"]["containers"][0].get("env") or []
          proj = os.environ["PROJ"]
          tag = open("/tmp/load.out").read()
          # re-read local tag
          local = None
          for line in open("/tmp/load.out"):
            if line.startswith("Loaded image:"):
              local = line.split("Loaded image:",1)[1].strip()
          cmd = ["timeout", "15", "docker", "run", "--rm"]
          for e in envs:
            name = e.get("name")
            if not name:
              continue
            if "value" in e:
              val = e["value"]
            elif "valueFrom" in e:
              secret = e["valueFrom"]["secretKeyRef"]["name"]
              val = subprocess.check_output(
                ["gcloud", "secrets", "versions", "access", "latest",
                 f"--secret={secret}", f"--project={proj}"],
                text=True,
              )
            else:
              continue
            cmd.append(f"-e={name}={val}")
          for k, v in {
            "OTEL_TRACES_EXPORTER": "none",
            "OTEL_METRICS_EXPORTER": "none",
            "OTEL_LOGS_EXPORTER": "none",
            "LOG_LEVEL": "DEBUG",
          }.items():
            cmd.append(f"-e={k}={v}")
          cmd.append(local)
          print("docker argv count", len(cmd), "image", local, flush=True)
          r = subprocess.run(cmd)
          raise SystemExit(r.returncode if r.returncode not in (124, 137) else 0)
          PY
