# Reusable plan/apply for one (app, env) against R2 state.
# Neon API keys: GitHub Environment per domain account (see config/neon-accounts.yaml).
# Only one NEON_API_KEY is available to each job (least privilege).
# Messaging is always Cloud Pub/Sub (never NATS) via modules/pubsub.
name: app-tofu

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
        description: App directory name under apps/
      env:
        required: true
        type: string
        description: Environment / platform name (stawi-dev | stawi-prod)
      mode:
        required: true
        type: string
        description: plan | apply
      # Resolved by caller from config/neon-accounts.yaml (e.g. neon-payments)
      neon_github_environment:
        required: true
        type: string
        description: GitHub Environment name that holds NEON_API_KEY for this app's neon.account
    secrets:
      # Repo-level secrets (R2, optional GCP). Neon keys are NOT listed here —
      # they come only from the job GitHub Environment (see environment: below).
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Least privilege: Environment secrets for this domain only (NEON_API_KEY).
    # Do not store domain Neon keys as repo secrets and dump them all into the job.
    environment: ${{ inputs.neon_github_environment }}
    concurrency:
      group: cloud-deploy-${{ inputs.app }}-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}/cloudrun
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.0"

      - name: Install yq
        working-directory: .
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve Neon account + validate env
        id: meta
        working-directory: .
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"
          ENV="${{ inputs.env }}"
          test -f "apps/${APP}/app.yaml"
          test -d "apps/${APP}/cloudrun"
          ACC=$(yq -r '.neon.account' "apps/${APP}/app.yaml")
          if [[ -z "$ACC" || "$ACC" == "null" ]]; then
            echo "::error::apps/${APP}/app.yaml missing neon.account"
            exit 1
          fi
          EXPECTED_ENV=$(yq -r ".accounts[\"${ACC}\"].github_environment" config/neon-accounts.yaml)
          if [[ -z "$EXPECTED_ENV" || "$EXPECTED_ENV" == "null" ]]; then
            echo "::error::Unknown neon.account '${ACC}' — add it to config/neon-accounts.yaml"
            exit 1
          fi
          if [[ "$EXPECTED_ENV" != "${{ inputs.neon_github_environment }}" ]]; then
            echo "::error::neon_github_environment mismatch: got ${{ inputs.neon_github_environment }}, registry has ${EXPECTED_ENV}"
            exit 1
          fi
          yq -r '.envs[]' "apps/${APP}/app.yaml" | grep -qx "${ENV}" \
            || { echo "::error::env ${ENV} not listed in apps/${APP}/app.yaml envs"; exit 1; }
          # Policy: deploy env allowed for account
          yq -e ".accounts[\"${ACC}\"].allowed_deploy_envs[] | select(. == \"${ENV}\")" config/neon-accounts.yaml >/dev/null \
            || { echo "::error::env ${ENV} not allowed for neon.account=${ACC}"; exit 1; }
          echo "neon_account=${ACC}" >> "$GITHUB_OUTPUT"
          echo "::notice::Neon account=${ACC} environment=${EXPECTED_ENV}"

      - name: Export Neon API key (environment-scoped only)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NEON_API_KEY:-}" ]]; then
            echo "::error::Missing NEON_API_KEY in GitHub Environment ${{ inputs.neon_github_environment }}"
            echo "::error::Create the Environment and set secret NEON_API_KEY (see docs/BACKEND.md)"
            exit 1
          fi
          echo "::add-mask::${NEON_API_KEY}"
          echo "TF_VAR_neon_api_key=${NEON_API_KEY}" >> "$GITHUB_ENV"

      - name: Configure R2 credentials for backend
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"
          echo "AWS_REGION=auto" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (WIF)
        if: false
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Tofu init (R2 state)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEY="cloud-deployment/apps/${{ inputs.app }}/${{ inputs.env }}/terraform.tfstate"
          tofu init \
            -backend-config="../../../config/r2-backend.hcl" \
            -backend-config="key=${KEY}" \
            -backend-config="endpoints={s3=\"${ENDPOINT}\"}"

      - name: Tofu plan
        if: inputs.mode == 'plan'
        run: |
          set -euo pipefail
          tofu plan \
            -var-file="envs/${{ inputs.env }}.tfvars" \
            -var="app_name=${{ inputs.app }}" \
            -var="platform=${{ inputs.env }}" \
            -out=tfplan

      - name: Upload plan
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.app }}-${{ inputs.env }}
          path: apps/${{ inputs.app }}/cloudrun/tfplan

      - name: Tofu apply
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          tofu apply -auto-approve \
            -var-file="envs/${{ inputs.env }}.tfvars" \
            -var="app_name=${{ inputs.app }}" \
            -var="platform=${{ inputs.env }}"
