# Reusable plan/apply for one (app, env).
# Resolves multi-account context: GCP project via WIF, Neon key via Secret Manager (preferred).
name: app-tofu

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      env:
        required: true
        type: string
      mode:
        required: true
        type: string
      # Pre-resolved by caller (from resolve-app-context) for environment protection
      gcp_github_environment:
        required: false
        type: string
        default: ""
      neon_github_environment:
        required: false
        type: string
        default: ""
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      # Repository secret (required for CI when job uses gcp-* environment).
      # Do not rely on neon-* environment secrets — they are not visible here.
      NEON_API_KEY:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Prefer GCP account environment for apply protection when set
    environment: ${{ inputs.gcp_github_environment != '' && inputs.gcp_github_environment || inputs.neon_github_environment }}
    concurrency:
      group: cloud-deploy-${{ inputs.app }}-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}/cloudrun
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.0"

      - name: Install yq / jq / gcloud
        working-directory: .
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          # gcloud for Secret Manager access after WIF
          if ! command -v gcloud >/dev/null; then
            echo "gcloud missing on runner — install google-cloud-sdk"
            exit 1
          fi

      - name: Resolve multi-account context
        id: ctx
        working-directory: .
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-app-context.sh \
            "${{ inputs.app }}" "${{ inputs.env }}" --format=gha

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ steps.ctx.outputs.workload_identity_provider }}
          service_account: ${{ steps.ctx.outputs.deploy_service_account }}

      # Neon org key: prefer Secret Manager (works when job environment is gcp-*).
      # GH Environment secret neon-identity/NEON_API_KEY is NOT visible when the job
      # uses environment: gcp-identity-prod — seed SM via scripts/seed-gcp-secrets.sh.
      - name: Load Neon org API key from Secret Manager
        id: neon_sm
        if: steps.auth.outcome == 'success' && steps.ctx.outputs.neon_sm_secret_id != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          PROJECT="${{ steps.ctx.outputs.neon_sm_project_id }}"
          SID="${{ steps.ctx.outputs.neon_sm_secret_id }}"
          VAL=$(gcloud secrets versions access latest --secret="${SID}" --project="${PROJECT}")
          echo "::add-mask::${VAL}"
          echo "TF_VAR_neon_api_key=${VAL}" >> "$GITHUB_ENV"
          echo "source=secret-manager" >> "$GITHUB_OUTPUT"

      - name: Load Neon org API key from secrets (fallback)
        if: env.TF_VAR_neon_api_key == ''
        env:
          # Available only if job environment is neon-* OR secret is a *repository* secret
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NEON_API_KEY:-}" ]]; then
            echo "::error::No Neon org API key available for OpenTofu."
            echo "::error::Seed Secret Manager (preferred when using gcp-* job environments):"
            echo "::error::  ./scripts/seed-gcp-secrets.sh --env stawi-prod --app identity-authentication --from-sops-neon identity"
            echo "::error::  # or --set neon-org-api-key=\$NEON_ORG_API_KEY --project stawi-identity"
            echo "::error::Expected SM secret: ${{ steps.ctx.outputs.neon_sm_secret_id }} in project ${{ steps.ctx.outputs.neon_sm_project_id }}"
            exit 1
          fi
          echo "::add-mask::${NEON_API_KEY}"
          echo "TF_VAR_neon_api_key=${NEON_API_KEY}" >> "$GITHUB_ENV"

      - name: Configure R2 credentials for backend
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"
          echo "AWS_REGION=auto" >> "$GITHUB_ENV"

      - name: Tofu init (R2 state)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEY="cloud-deployment/apps/${{ inputs.app }}/${{ inputs.env }}/terraform.tfstate"
          tofu init \
            -backend-config="../../../config/r2-backend.hcl" \
            -backend-config="key=${KEY}" \
            -backend-config="endpoints={s3=\"${ENDPOINT}\"}"

      - name: Tofu plan
        if: inputs.mode == 'plan'
        run: |
          set -euo pipefail
          # Fail plan early if WIF not configured (placeholders in registry)
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::warning::GCP WIF auth failed — plan may fail for google provider resources"
          fi
          tofu plan \
            -var-file="envs/${{ inputs.env }}.tfvars" \
            -var="app_name=${{ inputs.app }}" \
            -var="platform=${{ inputs.env }}" \
            -var="project_id=${{ steps.ctx.outputs.project_id }}" \
            -var="region=${{ steps.ctx.outputs.region }}" \
            -out=tfplan

      - name: Upload plan
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.app }}-${{ inputs.env }}
          path: apps/${{ inputs.app }}/cloudrun/tfplan

      - name: Tofu apply
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::error::GCP WIF required for apply"
            exit 1
          fi
          tofu apply -auto-approve \
            -var-file="envs/${{ inputs.env }}.tfvars" \
            -var="app_name=${{ inputs.app }}" \
            -var="platform=${{ inputs.env }}" \
            -var="project_id=${{ steps.ctx.outputs.project_id }}" \
            -var="region=${{ steps.ctx.outputs.region }}"
