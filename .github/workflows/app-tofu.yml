# Reusable plan/apply for one (app, env).
#
# Credentials model (no per-account GitHub Environments):
#   - R2: repository secrets (state backend)
#   - SOPS_AGE_KEY: repository secret → decrypt credentials/{gcp,neon}/…
#   - GCP: WIF from decrypted SOPS (or registry metadata already mirrored there)
#   - Neon API key: only if app.yaml has neon.account → credentials/neon/<account>/auth.yaml
#   - Runtime secrets: Secret Manager in the selected GCP project (OpenTofu)
name: app-tofu

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      env:
        required: true
        type: string
      mode:
        required: true
        type: string
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      SOPS_AGE_KEY:
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-deploy-${{ inputs.app }}-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}/cloudrun
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.0"

      - name: Install yq + sops
        working-directory: .
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          SOPS_VER=v3.11.0
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          sudo wget -qO /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VER}/sops-${SOPS_VER}.linux.${ARCH}"
          sudo chmod +x /usr/local/bin/sops

      - name: Resolve multi-account context
        id: ctx
        working-directory: .
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-app-context.sh \
            "${{ inputs.app }}" "${{ inputs.env }}" --format=gha

      - name: Decrypt SOPS credentials (GCP WIF + optional Neon)
        id: creds
        working-directory: .
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          ./.github/scripts/load-sops-credentials.sh \
            "${{ inputs.app }}" "${{ inputs.env }}" --format=gha
          # Registry labels (non-secret) for resource tagging
          if [[ -n "${{ steps.ctx.outputs.labels_json }}" ]]; then
            echo "TF_VAR_labels=${{ steps.ctx.outputs.labels_json }}" >> "$GITHUB_ENV"
          fi
          echo "::notice::Credentials loaded via SOPS (gcp=${{ steps.ctx.outputs.gcp_account }} neon=${{ steps.ctx.outputs.neon_account }})"

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: ${{ inputs.mode == 'plan' }}
        with:
          workload_identity_provider: ${{ steps.creds.outputs.workload_identity_provider }}
          service_account: ${{ steps.creds.outputs.deploy_service_account }}

      - name: Configure R2 credentials for backend
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"
          echo "AWS_REGION=auto" >> "$GITHUB_ENV"

      - name: Tofu init (R2 state → cloud-tofu-state)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEY="cloud-deployment/apps/${{ inputs.app }}/${{ inputs.env }}/terraform.tfstate"
          tofu init \
            -backend-config="../../../config/r2-backend.hcl" \
            -backend-config="key=${KEY}" \
            -backend-config="endpoints={s3=\"${ENDPOINT}\"}"

      - name: Tofu plan
        if: inputs.mode == 'plan'
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::warning::GCP WIF auth failed — google provider plan may fail"
          fi
          tofu plan \
            -var-file="envs/${{ inputs.env }}.tfvars" \
            -var="app_name=${{ inputs.app }}" \
            -var="platform=${{ inputs.env }}" \
            -var="project_id=${{ steps.creds.outputs.project_id }}" \
            -var="region=${{ steps.creds.outputs.region }}" \
            -out=tfplan

      - name: Upload plan
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.app }}-${{ inputs.env }}
          path: apps/${{ inputs.app }}/cloudrun/tfplan

      - name: Tofu apply
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::error::GCP WIF required for apply"
            exit 1
          fi
          tofu apply -auto-approve \
            -var-file="envs/${{ inputs.env }}.tfvars" \
            -var="app_name=${{ inputs.app }}" \
            -var="platform=${{ inputs.env }}" \
            -var="project_id=${{ steps.creds.outputs.project_id }}" \
            -var="region=${{ steps.creds.outputs.region }}"
