# Reusable plan/apply for one (app, env).
#
# Credentials model (no per-account GitHub Environments):
#   - R2: repository secrets (state backend)
#   - SOPS_AGE_KEY: repository secret → decrypt credentials/{gcp,neon}/…
#   - GCP: WIF from decrypted SOPS (or registry metadata already mirrored there)
#   - Neon API key: only if app.yaml has neon.account → credentials/neon/<account>/auth.yaml
#   - CLOUDFLARE_API_TOKEN: required for edge-lb-* (Cloudflare DNS A + ACME CNAMEs)
#   - Runtime secrets: Secret Manager in the selected GCP project (OpenTofu)
name: app-tofu

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      env:
        required: true
        type: string
      mode:
        required: true
        type: string
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      SOPS_AGE_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: false
        description: Zone DNS Edit on stawi.org — required for edge-lb-* apps

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: cloud-deploy-${{ inputs.app }}-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}/cloudrun
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.0"

      - name: Install yq + sops
        working-directory: .
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          SOPS_VER=v3.11.0
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          sudo wget -qO /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VER}/sops-${SOPS_VER}.linux.${ARCH}"
          sudo chmod +x /usr/local/bin/sops

      - name: Resolve multi-account context
        id: ctx
        working-directory: .
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-app-context.sh \
            "${{ inputs.app }}" "${{ inputs.env }}" --format=gha

      - name: Decrypt SOPS credentials (GCP WIF + optional Neon)
        id: creds
        working-directory: .
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          ./.github/scripts/load-sops-credentials.sh \
            "${{ inputs.app }}" "${{ inputs.env }}" --format=gha
          # Registry labels as TF map (JSON). Use heredoc — bare GITHUB_ENV/OUTPUT
          # cannot carry JSON with commas/braces.
          LABELS_JSON=$(./.github/scripts/resolve-app-context.sh \
            "${{ inputs.app }}" "${{ inputs.env }}" --format=json | jq -c '.labels // {}')
          {
            echo "TF_VAR_labels<<SOPS_LABELS_EOF"
            echo "${LABELS_JSON}"
            echo "SOPS_LABELS_EOF"
          } >> "$GITHUB_ENV"
          echo "::notice::Credentials loaded via SOPS (gcp=${{ steps.ctx.outputs.gcp_account }} neon=${{ steps.ctx.outputs.neon_account }})"

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: ${{ inputs.mode == 'plan' }}
        with:
          workload_identity_provider: ${{ steps.creds.outputs.workload_identity_provider }}
          service_account: ${{ steps.creds.outputs.deploy_service_account }}

      # Required for modules/cloudrun-migrate-job local-exec (gcloud run jobs execute --wait)
      - name: Set up gcloud CLI
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure R2 credentials for backend
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"
          echo "AWS_REGION=auto" >> "$GITHUB_ENV"

      # edge-lb-* manage Cloudflare DNS (A + ACME CNAMEs) entirely in OpenTofu.
      - name: Cloudflare API token for edge-lb DNS
        if: startsWith(inputs.app, 'edge-lb-')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is required for ${{ inputs.app }} (Zone:DNS:Edit on stawi.org)"
            exit 1
          fi
          {
            echo "TF_VAR_cloudflare_api_token<<CF_TOKEN_EOF"
            echo "${CLOUDFLARE_API_TOKEN}"
            echo "CF_TOKEN_EOF"
          } >> "$GITHUB_ENV"
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          echo "::notice::CLOUDFLARE_API_TOKEN loaded for edge DNS management"

      # Neon extension enablement (modules/neon-database null_resource) needs psql.
      - name: Install postgresql-client (Neon CREATE EXTENSION)
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            echo "psql already present: $(psql --version)"
            exit 0
          fi
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

      - name: Tofu init (R2 state → cloud-tofu-state)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEY="cloud-deployment/apps/${{ inputs.app }}/${{ inputs.env }}/terraform.tfstate"
          tofu init \
            -backend-config="../../../config/r2-backend.hcl" \
            -backend-config="key=${KEY}" \
            -backend-config="endpoints={s3=\"${ENDPOINT}\"}"

      # When neon.account (org API key) changes, state may still track projects in the
      # previous org (or a deleted project). Destroy with the wrong key fails; drop
      # module.db from state so a clean project is created under the current org.
      # Orphaned Neon projects must be deleted manually in the old org if needed.
      - name: Rebind Neon state if org credentials cannot refresh project
        if: inputs.mode == 'apply'
        env:
          APP: ${{ inputs.app }}
          ENV_NAME: ${{ inputs.env }}
          PROJECT_ID: ${{ steps.creds.outputs.project_id }}
          REGION: ${{ steps.creds.outputs.region }}
        run: |
          set -euo pipefail
          TF_COMMON=(
            -var-file="envs/${ENV_NAME}.tfvars"
            -var="app_name=${APP}"
            -var="platform=${ENV_NAME}"
            -var="project_id=${PROJECT_ID}"
            -var="region=${REGION}"
          )
          set +e
          tofu state list > /tmp/tofu-state-list.txt 2>/tmp/tofu-state-list.err
          LIST_RC=$?
          set -e
          if [[ $LIST_RC -ne 0 ]]; then
            echo "::warning::tofu state list failed; continuing without rebind"
            cat /tmp/tofu-state-list.err || true
            exit 0
          fi
          # Support both legacy module.db and frame-cloudrun-app composition.
          NEON_ADDR=""
          if grep -qE '^module\.frame\.module\.db\[0\]\.neon_project\.this$' /tmp/tofu-state-list.txt; then
            NEON_ADDR='module.frame.module.db[0].neon_project.this'
            DB_STATE_PREFIX='^module\.frame\.module\.db\[0\]\.'
          elif grep -qE '^module\.db\.neon_project\.this$' /tmp/tofu-state-list.txt; then
            NEON_ADDR='module.db.neon_project.this'
            DB_STATE_PREFIX='^module\.db\.'
          elif grep -qE '^module\.db\[0\]\.neon_project\.this$' /tmp/tofu-state-list.txt; then
            NEON_ADDR='module.db[0].neon_project.this'
            DB_STATE_PREFIX='^module\.db\[0\]\.'
          else
            echo "No neon_project in state — skip rebind"
            exit 0
          fi
          set +e
          # Diagnostic only: -lock=false so a hung/killed Neon refresh cannot leave
          # a stale state lock that blocks the subsequent apply.
          # Bound wait — Neon provider has been observed to hang indefinitely.
          timeout 90 tofu refresh -lock=false -target="${NEON_ADDR}" "${TF_COMMON[@]}" >/tmp/neon-refresh.log 2>&1
          RC=$?
          set -e
          if [[ $RC -eq 0 ]]; then
            echo "Neon project refresh OK with current credentials (${NEON_ADDR})"
            exit 0
          fi
          cat /tmp/neon-refresh.log || true
          if [[ $RC -eq 124 ]]; then
            echo "::warning::Neon project refresh timed out after 90s — skipping rebind (state left intact)"
            exit 0
          fi
          # Never state-rm on lock contention or transient API errors — only on hard
          # "project gone / wrong org" style failures.
          if grep -qiE 'Error acquiring the state lock|state lock|PreconditionFailed' /tmp/neon-refresh.log; then
            echo "::warning::State lock seen during unlock-free refresh (unexpected) — leaving module.db intact"
            exit 0
          fi
          if ! grep -qiE 'not found|404|does not exist|forbidden|401|unauthorized|organization' /tmp/neon-refresh.log; then
            echo "::warning::Neon refresh failed with non-rebind error — leaving module.db state intact"
            exit 0
          fi
          echo "::warning::Neon project refresh failed (likely org switch or deleted project). State-rm db module for rebind."
          while read -r addr; do
            [[ -z "$addr" ]] && continue
            echo "state rm $addr"
            tofu state rm "$addr" || true
          done < <(grep -E "${DB_STATE_PREFIX}" /tmp/tofu-state-list.txt || true)

      # Pub/Sub topics/subs may exist in GCP while missing from R2 state (partial
      # applies, target-only runs). Import so apply does not 409 Conflict.
      - name: Import orphaned Pub/Sub messaging into state
        if: inputs.mode == 'apply'
        env:
          APP: ${{ inputs.app }}
          ENV_NAME: ${{ inputs.env }}
          PROJECT_ID: ${{ steps.creds.outputs.project_id }}
          REGION: ${{ steps.creds.outputs.region }}
        run: |
          set -euo pipefail
          TF_COMMON=(
            -var-file="envs/${ENV_NAME}.tfvars"
            -var="app_name=${APP}"
            -var="platform=${ENV_NAME}"
            -var="project_id=${PROJECT_ID}"
            -var="region=${REGION}"
          )
          set +e
          tofu state list > /tmp/tofu-state-list.txt 2>/dev/null
          set -e

          # One-time: relocate legacy module.* addresses into module.frame.* via state mv
          # (OpenTofu moved blocks crash with sensitive-marked for_each in 1.10).
          if grep -qE 'module\s+"frame"' main.tf 2>/dev/null \
            && grep -qE '^(module\.service|module\.db|module\.secrets)' /tmp/tofu-state-list.txt 2>/dev/null; then
            echo "::group::Migrate state into module.frame"
            bash ../../../scripts/migrate-to-frame-module-state.sh
            tofu state list > /tmp/tofu-state-list.txt 2>/dev/null || true
            echo "::endgroup::"
          fi

          import_if_missing() {
            local addr="$1" id="$2"
            if grep -qxF "$addr" /tmp/tofu-state-list.txt 2>/dev/null; then
              return 0
            fi
            echo "Importing missing $addr <- $id"
            set +e
            tofu import "${TF_COMMON[@]}" "$addr" "$id" >/tmp/tofu-import.log 2>&1
            RC=$?
            set -e
            if [[ $RC -eq 0 ]]; then
              echo "  imported $addr"
              echo "$addr" >> /tmp/tofu-state-list.txt
            else
              echo "::warning::import $addr failed (resource may not exist yet)"
              cat /tmp/tofu-import.log || true
            fi
          }

          # Default Frame/Ory events topic + optional push sub + DLQ.
          # Prefer frame-cloudrun-app addresses when main.tf uses module "frame".
          if grep -qE 'module\s+"frame"' main.tf 2>/dev/null; then
            MSG_PREFIX='module.frame.module.messaging[0]'
          else
            MSG_PREFIX='module.messaging'
          fi
          TOPIC="${APP}-events"
          DLQ="${APP}-events-dlq"
          if gcloud pubsub topics describe "$TOPIC" --project="$PROJECT_ID" >/dev/null 2>&1; then
            import_if_missing "${MSG_PREFIX}.google_pubsub_topic.this[\"events\"]" \
              "projects/${PROJECT_ID}/topics/${TOPIC}"
          fi
          if gcloud pubsub topics describe "$DLQ" --project="$PROJECT_ID" >/dev/null 2>&1; then
            import_if_missing "${MSG_PREFIX}.google_pubsub_topic.dlq[0]" \
              "projects/${PROJECT_ID}/topics/${DLQ}"
          fi
          # Push subscription (Frame) or pull (same name as topic for Ory)
          for SUB in "${TOPIC}-push" "$TOPIC"; do
            if gcloud pubsub subscriptions describe "$SUB" --project="$PROJECT_ID" >/dev/null 2>&1; then
              import_if_missing "${MSG_PREFIX}.google_pubsub_subscription.this[\"events\"]" \
                "projects/${PROJECT_ID}/subscriptions/${SUB}"
              break
            fi
          done

      - name: Tofu plan
        if: inputs.mode == 'plan'
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::warning::GCP WIF auth failed — google provider plan may fail"
          fi
          tofu plan \
            -var-file="envs/${{ inputs.env }}.tfvars" \
            -var="app_name=${{ inputs.app }}" \
            -var="platform=${{ inputs.env }}" \
            -var="project_id=${{ steps.creds.outputs.project_id }}" \
            -var="region=${{ steps.creds.outputs.region }}" \
            -out=tfplan

      - name: Upload plan
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.app }}-${{ inputs.env }}
          path: apps/${{ inputs.app }}/cloudrun/tfplan

      - name: Tofu apply
        if: inputs.mode == 'apply'
        env:
          APP: ${{ inputs.app }}
          ENV_NAME: ${{ inputs.env }}
          PROJECT_ID: ${{ steps.creds.outputs.project_id }}
          REGION: ${{ steps.creds.outputs.region }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::error::GCP WIF required for apply"
            exit 1
          fi
          TF_COMMON=(
            -var-file="envs/${ENV_NAME}.tfvars"
            -var="app_name=${APP}"
            -var="platform=${ENV_NAME}"
            -var="project_id=${PROJECT_ID}"
            -var="region=${REGION}"
          )

          # Composition module (all Frame apps) vs legacy hand-rolled modules.
          USE_FRAME=false
          if grep -qE 'module\s+"frame"' main.tf 2>/dev/null; then
            USE_FRAME=true
          fi

          # After first-time state mv into module.frame, prefer a single untargeted apply
          # so nested resources and IAM all land together.
          if [[ "$USE_FRAME" == "true" ]]; then
            echo "::group::Apply full frame stack"
            tofu apply -auto-approve "${TF_COMMON[@]}"
            echo "::endgroup::"
            exit 0
          fi

          # LB-only / infra-only apps (e.g. edge-lb-*) have no Neon — full apply only.
          if [[ "$USE_FRAME" == "false" ]] && ! grep -qE 'module\s+"db"' main.tf 2>/dev/null; then
            echo "::group::Apply full stack (no Neon/migrate phases)"
            tofu apply -auto-approve "${TF_COMMON[@]}"
            echo "::endgroup::"
            exit 0
          fi

          # Resolve module address prefixes for phased apply.
          if [[ "$USE_FRAME" == "true" ]]; then
            T_DB='module.frame.module.db'
            T_SECRETS='module.frame.module.secrets'
            T_MSG='module.frame.module.messaging'
            T_MIGRATE='module.frame.module.migrate'
            T_SA='module.frame.google_service_account.runtime'
            T_SVC='module.frame.module.service'
            T_WARM='module.frame.module.keep_warm'
          else
            T_DB='module.db'
            T_SECRETS='module.secrets'
            T_MSG='module.messaging'
            T_MIGRATE='module.migrate'
            T_SA='google_service_account.runtime'
            T_SVC='module.service'
            T_WARM='module.keep_warm'
          fi

          # Phase 1: DB + secrets + migrate job definition (no service yet).
          # Neon provider can hang; bound wait so service deploys still land.
          SKIP_MIGRATE_EXECUTE=false
          echo "::group::Apply infra + migrate job"
          set +e
          timeout 300 tofu apply -auto-approve \
            -target="${T_DB}" \
            -target="${T_SECRETS}" \
            -target="${T_MSG}" \
            -target="${T_MIGRATE}" \
            -target="${T_SA}" \
            "${TF_COMMON[@]}"
          P1_RC=$?
          set -e
          if [[ $P1_RC -eq 124 ]]; then
            echo "::warning::DB/migrate phase timed out after 300s (often Neon refresh hang) — service apply with -refresh=false"
            SKIP_MIGRATE_EXECUTE=true
          elif [[ $P1_RC -ne 0 ]]; then
            echo "::error::DB/migrate phase failed (exit ${P1_RC})"
            exit "$P1_RC"
          fi
          echo "::endgroup::"

          # Phase 2: always run migrations (idempotent). Failures are fatal for Ory apps
          # (hydra/keto). Frame apps may still bootstrap after schema — warn and continue
          # so the service can still deploy (tenancy service-bot is a known follow-up).
          MIGRATE_JOB="${APP}-migrate"
          if [[ "$SKIP_MIGRATE_EXECUTE" == "true" ]]; then
            echo "::warning::Skipping migrate execute after DB phase timeout (existing schema assumed)"
          elif gcloud run jobs describe "${MIGRATE_JOB}" --project="${PROJECT_ID}" --region="${REGION}" >/dev/null 2>&1; then
            echo "::group::Execute migrate job ${MIGRATE_JOB}"
            if gcloud run jobs execute "${MIGRATE_JOB}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --wait; then
              echo "Migration job ${MIGRATE_JOB} completed successfully"
            else
              case "${APP}" in
                identity-oauth2-hydra|identity-authorization-keto)
                  echo "::error::Required migrate job ${MIGRATE_JOB} failed"
                  exit 1
                  ;;
                *)
                  echo "::warning::Migrate job ${MIGRATE_JOB} failed — continuing to service apply"
                  ;;
              esac
            fi
            echo "::endgroup::"
          else
            echo "::warning::No migrate job ${MIGRATE_JOB} — skipping execute"
          fi

          # Phase 3: full apply (Cloud Run service etc.). On Neon hang, fall back to
          # service-only without refresh so env/image changes still ship.
          echo "::group::Apply full stack"
          set +e
          timeout 600 tofu apply -auto-approve "${TF_COMMON[@]}"
          P3_RC=$?
          set -e
          if [[ $P3_RC -eq 124 || $P3_RC -ne 0 ]]; then
            echo "::warning::Full apply exit ${P3_RC} — trying service-only -refresh=false"
            tofu apply -auto-approve -refresh=false \
              -target="${T_SVC}" \
              -target="${T_WARM}" \
              -target=module.domain \
              "${TF_COMMON[@]}"
          fi
          echo "::endgroup::"
