# Reusable plan/apply for one (app, env).
# Model: docs/superpowers/specs/2026-07-24-account-selection-and-ci-credentials.md
#
# - GCP: WIF from registry (gcp.account + env) — no GCP keys in GitHub
# - Neon: only if app has neon.account → job environment neon--{account}, secret API_KEY
# - R2: repository secrets only
# - Runtime secrets: Secret Manager in selected GCP project (OpenTofu)
name: app-tofu

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      env:
        required: true
        type: string
      mode:
        required: true
        type: string
      # From resolve-app-context: neon--{account} or deploy--{gcp}--{env} or empty
      job_environment:
        required: false
        type: string
        default: ""
      uses_neon:
        required: false
        type: boolean
        default: false
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      # Only present when job_environment is neon--* (secret name API_KEY)
      API_KEY:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Single environment: Neon credential env when app uses Neon; else optional protection env
    environment: ${{ inputs.job_environment != '' && inputs.job_environment || '' }}
    concurrency:
      group: cloud-deploy-${{ inputs.app }}-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}/cloudrun
    steps:
      - uses: actions/checkout@v5

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.10.0"

      - name: Install yq
        working-directory: .
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve multi-account context
        id: ctx
        working-directory: .
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-app-context.sh \
            "${{ inputs.app }}" "${{ inputs.env }}" --format=gha

      - name: Load Neon org API key (only if app uses Neon)
        if: inputs.uses_neon
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY:-}" ]]; then
            echo "::error::App uses neon.account but secret API_KEY is empty."
            echo "::error::Create GitHub Environment '${{ inputs.job_environment }}' with secret API_KEY"
            echo "::error::  (bootstrap-neon-account.sh --account … --sync-github-env)"
            exit 1
          fi
          echo "::add-mask::${API_KEY}"
          echo "TF_VAR_neon_api_key=${API_KEY}" >> "$GITHUB_ENV"
          echo "::notice::Neon API key loaded from environment ${{ inputs.job_environment }}"

      - name: Skip Neon provider inputs
        if: ${{ !inputs.uses_neon }}
        run: |
          echo "::notice::App has no neon.account — Neon provider key not loaded"
          # Provide dummy so roots that still declare neon_api_key validate; prefer apps without neon later
          echo "TF_VAR_neon_api_key=unused" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ steps.ctx.outputs.workload_identity_provider }}
          service_account: ${{ steps.ctx.outputs.deploy_service_account }}

      - name: Configure R2 credentials for backend
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"
          echo "AWS_REGION=auto" >> "$GITHUB_ENV"

      - name: Tofu init (R2 state)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEY="cloud-deployment/apps/${{ inputs.app }}/${{ inputs.env }}/terraform.tfstate"
          tofu init \
            -backend-config="../../../config/r2-backend.hcl" \
            -backend-config="key=${KEY}" \
            -backend-config="endpoints={s3=\"${ENDPOINT}\"}"

      - name: Tofu plan
        if: inputs.mode == 'plan'
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::warning::GCP WIF auth failed — google provider plan may fail"
          fi
          tofu plan \
            -var-file="envs/${{ inputs.env }}.tfvars" \
            -var="app_name=${{ inputs.app }}" \
            -var="platform=${{ inputs.env }}" \
            -var="project_id=${{ steps.ctx.outputs.project_id }}" \
            -var="region=${{ steps.ctx.outputs.region }}" \
            -out=tfplan

      - name: Upload plan
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.app }}-${{ inputs.env }}
          path: apps/${{ inputs.app }}/cloudrun/tfplan

      - name: Tofu apply
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          if [[ "${{ steps.auth.outcome }}" != "success" ]]; then
            echo "::error::GCP WIF required for apply"
            exit 1
          fi
          tofu apply -auto-approve \
            -var-file="envs/${{ inputs.env }}.tfvars" \
            -var="app_name=${{ inputs.app }}" \
            -var="platform=${{ inputs.env }}" \
            -var="project_id=${{ steps.ctx.outputs.project_id }}" \
            -var="region=${{ steps.ctx.outputs.region }}"
