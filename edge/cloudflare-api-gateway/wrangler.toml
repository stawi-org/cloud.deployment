# Cloudflare Worker — public edge (SSL on Cloudflare / orange cloud)
# See docs/SSL_EDGE_POLICY.md
#
# Deploy: CLOUDFLARE_API_TOKEN=… npm run deploy
# Token: Account.Workers Scripts:Edit, Zone.Workers Routes:Edit, Zone.DNS:Edit

name = "stawi-api-gateway"
main = "src/worker.js"
compatibility_date = "2026-07-01"
workers_dev = true
account_id = "c358ea38bde6fd03d13bf87068635230"

# Product path API + Scalar hub (accounts / oauth2* / authz* = CF CNAME or domain map).
# pay.stawi.org: Worker host proxy (CF direct; Host → run.app) — see host_routes.
[[routes]]
pattern = "api.stawi.org/*"
zone_name = "stawi.org"

[[routes]]
pattern = "pay.stawi.org/*"
zone_name = "stawi.org"

# Stawi Imports API on the stawi.trade zone — Worker custom domain (DNS + cert
# auto-provisioned). Proxied to the imports Cloud Run via host_routes.
[[routes]]
pattern = "api.stawi.trade"
custom_domain = true
